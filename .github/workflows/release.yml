# .github/workflows/release.yml
name: Auto Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      new-version: ${{ steps.check.outputs.new-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Check if version was bumped
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(uv version | cut -d' ' -f2)
          echo "Current version: $CURRENT_VERSION"

          git checkout HEAD~1 -- pyproject.toml || true
          PREVIOUS_VERSION=$(uv version | cut -d' ' -f2) 2>/dev/null || echo "0.0.0"
          git checkout HEAD -- pyproject.toml
          echo "Previous version: $PREVIOUS_VERSION"

          if [[ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "new-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version-bump
    if: needs.check-version-bump.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Build package distributions
        run: |
          uv build --no-sources --build-constraint build-constraints.txt --require-hashes
          ls -lh dist/

      - name: Optimize uv cache for CI
        run: uv cache prune --ci

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-pypi:
    needs: [check-version-bump, build]
    if: needs.check-version-bump.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/artigence-linkedin-mcp/${{ needs.check-version-bump.outputs.new-version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          verbose: true
          skip-existing: true

  prepare-release:
    needs: [check-version-bump, publish-pypi]
    if: needs.check-version-bump.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version-bump.outputs.new-version }}
    permissions:
      contents: write
    outputs:
      release-sha: ${{ steps.release-sha.outputs.release-sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Update manifest.json version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = "${{ env.VERSION }}"
          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit manifest update
        shell: bash
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: update manifest.json to v$VERSION [skip ci]"
            git push origin main
          fi

      - name: Create release tag
        shell: bash
        run: |
          if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Publish the released commit
        id: release-sha
        run: echo "release-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-mcpb:
    needs: [check-version-bump, prepare-release]
    if: needs.check-version-bump.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version-bump.outputs.new-version }}
      MCPB_VERSION: 2.1.2
    permissions:
      contents: read
    steps:
      - name: Checkout released commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.release-sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Validate and build MCP bundle
        shell: bash
        run: |
          bunx "@anthropic-ai/mcpb@$MCPB_VERSION" validate manifest.json
          bunx "@anthropic-ai/mcpb@$MCPB_VERSION" pack .
          mv linkedin-mcp-server.mcpb artigence-linkedin-mcp-v$VERSION.mcpb

      - name: Generate release notes
        shell: bash
        run: |
          envsubst < RELEASE_NOTES_TEMPLATE.md > RELEASE_NOTES.md

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-assets
          path: |
            artigence-linkedin-mcp-v${{ env.VERSION }}.mcpb
            RELEASE_NOTES.md
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  create-github-release:
    needs: [check-version-bump, build-mcpb]
    if: needs.check-version-bump.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version-bump.outputs.new-version }}
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-assets

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            *.mcpb
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md

      - name: Summary
        shell: bash
        run: |
          echo "Successfully released v$VERSION!"
          echo "PyPI: https://pypi.org/project/artigence-linkedin-mcp/$VERSION/"
          echo "GitHub: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
